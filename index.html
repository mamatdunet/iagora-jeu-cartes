const STORE_KEY = "causons-ia-cards-v2";

/* Modification des cartes réservée : mot de passe vérifié par son empreinte SHA-256.
   Protection côté navigateur seulement (page statique) : elle évite les modifications
   accidentelles, elle ne remplace pas un vrai contrôle d’accès serveur. */
const EDIT_HASH = "a1d7ad03530de6ad1f2b66be658f8a4b7bd3a640d745e7b2bee99ee9bc046b50";
const AUTH_KEY = "causons-ia-edit-ok";
const sha256 = async (txt) => {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
};
const FONTS =
  "@import url('https://fonts.googleapis.com/css2?family=Anton&family=Heebo:wght@300..900&display=swap');";
const F_DISP = "'Anton', 'Archivo Narrow', 'Helvetica Neue', Arial, sans-serif";
const F_BODY = "'Heebo', 'Helvetica Neue', Arial, sans-serif";
const F_MONO = F_BODY;

const num = (n) => String(n).padStart(2, "0");

/* ------------------------------------------------------------------ */

function CausonsIA() {
  const [cards, setCards] = useState(CARDS);
  const [fam, setFam] = useState("all");
  const [q, setQ] = useState("");
  const [flipped, setFlipped] = useState(() => new Set());
  const [editing, setEditing] = useState(null);
  const [view, setView] = useState("deck"); // deck | print | guide | verif
  const [legend, setLegend] = useState(false);
  const [status, setStatus] = useState("chargement");
  const [unlocked, setUnlocked] = useState(() => {
    try { return sessionStorage.getItem(AUTH_KEY) === "1"; } catch { return false; }
  });
  const [pendingAction, setPendingAction] = useState(null);
  /* Toute action qui modifie le jeu passe par ici. */
  const guard = (fn) => (...args) => {
    if (unlocked) return fn(...args);
    setPendingAction(() => () => fn(...args));
  };
  const unlock = () => {
    setUnlocked(true);
    try { sessionStorage.setItem(AUTH_KEY, "1"); } catch {}
    const run = pendingAction; setPendingAction(null);
    if (run) run();
  };
  const lock = () => {
    setUnlocked(false); setEditing(null);
    try { sessionStorage.removeItem(AUTH_KEY); } catch {}
  };
  const saveTimer = useRef(null);
  const fileRef = useRef(null);

  /* ---- persistance ---- */
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const r = await window.storage.get(STORE_KEY);
        const saved = r && r.value ? JSON.parse(r.value) : null;
        if (alive && Array.isArray(saved) && saved.length) {
          setCards(saved);
          setStatus("chargé");
        } else if (alive) setStatus("prêt");
      } catch {
        if (alive) setStatus("prêt");
      }
    })();
    return () => { alive = false; };
  }, []);

  const persist = (next) => {
    setCards(next);
    setStatus("enregistrement…");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORE_KEY, JSON.stringify(next));
        setStatus("enregistré");
      } catch {
        setStatus("non enregistré (session seulement)");
      }
    }, 400);
  };

  /* ---- filtres ---- */
  const shown = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return cards.filter((c) => {
      if (fam !== "all" && c.fam !== fam) return false;
      if (!needle) return true;
      const hay = [c.titre, c.recto, c.verso, c.relance, c.relance2, c.piste,
        ...(c.items || []), ...(c.sources || []).map((s) => s.label)]
        .filter(Boolean).join(" ").toLowerCase();
      return hay.includes(needle);
    });
  }, [cards, fam, q]);

  const counts = useMemo(() => {
    const o = {};
    FAM_ORDER.forEach((k) => { o[k] = cards.filter((c) => c.fam === k).length; });
    return o;
  }, [cards]);

  const original = useMemo(() => {
    const m = {};
    CARDS.forEach((c) => { m[c.id] = JSON.stringify(c); });
    return m;
  }, []);
  const isEdited = (c) => original[c.id] !== undefined && original[c.id] !== JSON.stringify(c);

  /* ---- actions ---- */
  const toggleFlip = (id) =>
    setFlipped((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const flipAll = () =>
    setFlipped((s) => (s.size >= shown.length ? new Set() : new Set(shown.map((c) => c.id))));

  const saveCard = (card) => persist(cards.map((c) => (c.id === card.id ? card : c)));
  const deleteCard = (id) => { persist(cards.filter((c) => c.id !== id)); setEditing(null); };
  const duplicateCard = (card) => {
    const id = Math.max(0, ...cards.map((c) => c.id)) + 1;
    const i = cards.findIndex((c) => c.id === card.id);
    const copy = { ...card, id, titre: card.titre + " (copie)" };
    const next = [...cards]; next.splice(i + 1, 0, copy); persist(next);
    setEditing(copy);
  };
  const addCard = () => {
    const id = Math.max(0, ...cards.map((c) => c.id)) + 1;
    const blank = {
      id, fam: fam === "all" ? "vert" : fam, titre: "Nouvelle carte",
      recto: "Votre question, lisible en 3 secondes ?",
      verso: "Le fait concret, le chiffre, l’exemple.",
      sources: [], relance: "Et vous, qu’en pensez-vous ?", relance2: "", piste: "", items: [],
    };
    persist([...cards, blank]); setEditing(blank);
  };
  const resetCard = (id) => {
    const orig = CARDS.find((c) => c.id === id);
    if (orig) { saveCard(orig); setEditing(orig); }
  };
  const resetAll = () => {
    if (window.confirm("Revenir au jeu d’origine ? Toutes vos modifications seront perdues.")) {
      persist(CARDS); setEditing(null);
    }
  };

  const download = async (blob, name) => {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try {
        await dl.save({ filename: name, data: blob });
        setStatus("fichier enregistré");
      } catch (err) {
        const code = err && err.code;
        setStatus(code === "declined" ? "enregistrement annulé" : "enregistrement impossible");
      }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  };

  const tableRows = () =>
    cards.map((c) => ({
      "N°": c.id,
      Famille: famOf(c.fam).label,
      "Clé famille": c.fam,
      Niveau: c.niveau || "",
      Titre: c.titre,
      "Recto (accroche)": c.recto,
      "Verso (le fait)": c.verso || "",
      Items: (c.items || []).join("  |  "),
      Sources: (c.sources || []).map((s) => s.label).join("  |  "),
      "URL des sources": (c.sources || []).map((s) => s.url).filter(Boolean).join("  |  "),
      "Relance animateur": c.relance || "",
      "Relance 2": c.relance2 || "",
      Piste: c.piste || "",
      "Duo avec": c.duo || "",
    }));

  const exportAs = async (kind) => {
    const base = "causons-ia-cartes";
    try {
      if (kind === "json") {
        await download(new Blob([JSON.stringify(cards, null, 2)], { type: "application/json" }), base + ".json");
        setStatus("export json"); return;
      }
      const ws = XLSX.utils.json_to_sheet(tableRows());
      ws["!cols"] = [
        { wch: 5 }, { wch: 17 }, { wch: 11 }, { wch: 8 }, { wch: 36 }, { wch: 48 },
        { wch: 72 }, { wch: 62 }, { wch: 34 }, { wch: 48 }, { wch: 48 }, { wch: 40 },
        { wch: 48 }, { wch: 9 },
      ];
      if (kind === "csv") {
        const csv = XLSX.utils.sheet_to_csv(ws, { FS: ";" });
        await download(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }), base + ".csv");
        setStatus("export csv"); return;
      }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Cartes");
      const notes = [
        ["Catégorie", "Point de vigilance"],
        ...VERIF.solides.map((x) => ["Chiffre solide", x]),
        ...VERIF.fragiles.map((x) => ["Chiffre fragile", x]),
        ...VERIF.sansLien.map((x) => ["Sans source (normal)", x]),
      ];
      const ws2 = XLSX.utils.aoa_to_sheet(notes);
      ws2["!cols"] = [{ wch: 20 }, { wch: 112 }];
      XLSX.utils.book_append_sheet(wb, ws2, "À vérifier");
      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      await download(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), base + ".xlsx");
      setStatus("export excel");
    } catch {
      setStatus("export impossible");
    }
  };
  const importJSON = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const parsed = JSON.parse(String(rd.result));
        if (Array.isArray(parsed) && parsed.length) persist(parsed);
        else window.alert("Ce fichier ne contient pas de liste de cartes.");
      } catch { window.alert("Fichier illisible. Attendu : un export JSON de cette appli."); }
    };
    rd.readAsText(f);
    e.target.value = "";
  };
  const copyMarkdown = async () => {
    const md = cards.map((c) => {
      const f = famOf(c.fam);
      let s = `### ${num(c.id)} · ${f.label}${c.niveau ? " · piste " + c.niveau : ""} — ${c.titre}\n`;
      s += `**Recto :** ${c.recto}\n`;
      if (c.verso) s += `**Verso :** ${c.verso}\n`;
      if (c.items && c.items.length) s += c.items.map((it, i) => `${i + 1}. ${it}`).join("\n") + "\n";
      if (c.sources && c.sources.length)
        s += `**Sources :** ${c.sources.map((x) => x.label + (x.url ? " — " + x.url : "")).join(" · ")}\n`;
      if (c.relance) s += `**Relance :** ${c.relance}\n`;
      if (c.relance2) s += `**Relance 2 :** ${c.relance2}\n`;
      if (c.piste) s += `**Piste :** ${c.piste}\n`;
      return s;
    }).join("\n");
    try { await navigator.clipboard.writeText(md); setStatus("texte copié"); }
    catch { setStatus("copie impossible"); }
  };

  /* ------------------------------- rendu ------------------------------- */
  return (
    <div style={{ background: C.page, color: C.encre, fontFamily: F_BODY, minHeight: "100vh" }}>
      <style>{`
        ${FONTS}
        .display { font-family: ${F_DISP}; font-weight: 400; line-height: .95;
                   letter-spacing: .005em; text-transform: uppercase; }
        .eyebrow { font-family: ${F_BODY}; font-size: 11.5px; font-weight: 600;
                   letter-spacing: .18em; text-transform: uppercase; }
        .flip { transform-style: preserve-3d; transition: transform .42s ${EASE}; }
        .flip.on { transform: rotateY(180deg); }
        .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .back { transform: rotateY(180deg); }
        .lift { transition: box-shadow .22s ${EASE}, transform .22s ${EASE}; }
        .lift:hover { transform: translateY(-4px); box-shadow: ${SH.lg}; }
        .lift:active { transform: scale(.97); }
        .ta { font-family: ${F_BODY}; }
        a.src:hover { text-decoration: underline; }
        .link-pink { color: ${C.bleu}; transition: color .12s ${EASE}; }
        .link-pink:hover { color: ${C.rose}; }
        .icon-btn { border: 2px solid ${C.noir}; transition: background .12s ${EASE}, color .12s ${EASE}; }
        .icon-btn:hover { background: ${C.bleu} !important; color: #fff; }
        .menu-item:hover { background: ${C.bleuSoft}; }
        .fade-b { scrollbar-width: thin; scrollbar-color: ${C.ligne} transparent; }
        .fade-b::-webkit-scrollbar { width: 5px; }
        .fade-b::-webkit-scrollbar-thumb { background: ${C.ligne}; border-radius: 99px; }
        ::selection { background: ${C.rose}; color: #000; }
        @media (prefers-reduced-motion: reduce) { .flip, .lift { transition: none !important; } }
        @media print {
          .noprint { display: none !important; }
          body { background: #fff !important; }
          .sheet { break-inside: avoid; page-break-inside: avoid; }
          @page { size: A4; margin: 10mm; }
        }
      `}</style>

      {/* ---------- en-tête ---------- */}
      <header className="noprint" style={{ background: C.page, borderBottom: `1px solid ${C.ligne}` }}>
        <div className="px-5 pt-7 pb-5" style={{ maxWidth: 1240, margin: "0 auto" }}>
          <div className="flex flex-wrap items-end justify-between gap-5">
            <div>
              <div className="eyebrow" style={{ fontSize: 13, color: C.rose }}>
                IAGORA × AMUSEURS — FESTIVALS IA 2026
              </div>
              <h1 className="display" style={{ fontSize: "clamp(44px,5vw,80px)", marginTop: 10, color: C.bleu }}>
                Causons <span style={{ color: C.rose }}>IA.</span>
              </h1>
              <p style={{ color: C.encre, maxWidth: 580, marginTop: 14, fontSize: 16, lineHeight: 1.65 }}>
                {cards.length} petites cartes pour papoter d’intelligence artificielle.
                Cliquez une carte pour la retourner, le crayon pour modifier son contenu.
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <TopBtn onClick={() => setView(view === "guide" ? "deck" : "guide")} active={view === "guide"} icon={BookOpen} label="Guide animateur" />
              <TopBtn onClick={() => setView(view === "verif" ? "deck" : "verif")} active={view === "verif"} icon={AlertTriangle} label="À vérifier" />
              <TopBtn onClick={() => { setView("print"); }} active={view === "print"} icon={Printer} label="Planches à imprimer" />
            </div>
          </div>
        </div>
        <div className="flex" style={{ height: 7 }}>
          {FAM_ORDER.map((k) => (
            <span key={k} style={{ flex: 1, background: FAM[k].color }} />
          ))}
        </div>
      </header>

      {view === "guide" && <GuidePanel onClose={() => setView("deck")} />}
      {view === "verif" && <VerifPanel onClose={() => setView("deck")} />}
      {view === "print" && <PrintSheet cards={cards} onClose={() => setView("deck")} />}

      {view === "deck" && (
        <>
          {/* ---------- barre d’outils ---------- */}
          <div className="noprint" style={{ position: "sticky", top: 0, zIndex: 20, background: "rgba(255,255,255,.95)", backdropFilter: "blur(8px)", borderBottom: `1px solid ${C.ligne}` }}>
            <div className="px-5 py-3" style={{ maxWidth: 1240, margin: "0 auto" }}>
              <div className="flex flex-wrap items-center gap-2">
                <Chip active={fam === "all"} onClick={() => setFam("all")} color={C.bleu} dark label={`Toutes · ${cards.length}`} />
                {FAM_ORDER.map((k) => (
                  <Chip key={k} active={fam === k} onClick={() => setFam(k)} color={FAM[k].color}
                    label={`${FAM[k].label} · ${counts[k]}`} />
                ))}
                <div className="flex items-center gap-2 ml-auto">
                  <div className="flex items-center gap-2 px-3 py-2" style={{ background: C.page, border: `2px solid ${C.ligne}`, borderRadius: R.pill }}>
                    <Search size={15} color={C.muted} />
                    <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Chercher un mot, un chiffre…"
                      style={{ border: 0, outline: "none", fontSize: 14, width: 190, background: "transparent", fontFamily: F_BODY }} />
                    {q && <button onClick={() => setQ("")} aria-label="Effacer"><X size={14} color={C.muted} /></button>}
                  </div>
                  <SmallBtn onClick={flipAll} icon={RotateCcw} label="Retourner" />
                  <SmallBtn onClick={guard(addCard)} icon={Plus} label="Ajouter" />
                  <ExportMenu onExport={exportAs} />
                  <SmallBtn onClick={guard(() => fileRef.current && fileRef.current.click())} icon={Upload} label="Importer" />
                  <SmallBtn onClick={copyMarkdown} icon={Copy} label="Copier" />
                  <input ref={fileRef} type="file" accept="application/json" onChange={importJSON} style={{ display: "none" }} />
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2">
                <p style={{ fontSize: 16, color: C.encre, flex: "1 1 280px", lineHeight: 1.5 }}>
                  {fam === "all"
                    ? `${FAM_ORDER.length} familles de cartes. Chacune sert un besoin différent dans la conversation.`
                    : famOf(fam).sub}
                </p>
                <button onClick={() => setLegend(!legend)} className="flex items-center gap-1.5 link-pink"
                   style={{ fontSize: 14, fontWeight: 600, whiteSpace: "nowrap" }}>
                  <Info size={15} /> {legend ? "Masquer" : "En savoir plus"}
                </button>
              </div>

              {legend && (
                <div className="mt-2" style={{ background: C.bleuSoft, borderRadius: R.lg, padding: "16px 18px", display: "grid", gap: 11 }}>
                  {FAM_ORDER.map((k) => (
                    <div key={k} className="flex gap-2.5 items-start">
                      <span style={{ width: 11, height: 11, borderRadius: 99, background: FAM[k].color, marginTop: 7, flexShrink: 0 }} />
                      <p style={{ fontSize: 16, lineHeight: 1.45 }}>
                        <strong style={{ fontWeight: 700 }}>{FAM[k].label}</strong>
                        <span style={{ color: C.encre }}> — {FAM[k].sub}</span>
                        <span style={{ color: C.rose, fontSize: 12, fontWeight: 600 }}>{`  ${counts[k]} cartes`}</span>
                      </p>
                    </div>
                  ))}
                  <p style={{ fontSize: 13.5, color: C.muted, borderTop: `1px solid ${C.ligne}`, paddingTop: 10, lineHeight: 1.6 }}>
                    Une carte peut changer de famille à tout moment : ouvrez-la avec le crayon, la famille est le premier champ.
                  </p>
                </div>
              )}

              <div className="flex items-center justify-between mt-2" style={{ fontSize: 11.5, color: C.muted }}>
                <span>{shown.length} carte{shown.length > 1 ? "s" : ""} affichée{shown.length > 1 ? "s" : ""}</span>
                <span className="flex items-center gap-3">
                  <span>{status}</span>
                  {unlocked && (
                    <button onClick={lock} className="link-pink" style={{ textDecoration: "underline" }}>verrouiller l’édition</button>
                  )}
                  <button onClick={guard(resetAll)} className="link-pink" style={{ textDecoration: "underline" }}>tout réinitialiser</button>
                </span>
              </div>
            </div>
          </div>

          {/* ---------- grille ---------- */}
          <main className="px-5 py-7" style={{ maxWidth: 1240, margin: "0 auto" }}>
            <div className="grid gap-5" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(288px, 1fr))" }}>
              {shown.map((c) => (
                <CardView key={c.id} card={c} flipped={flipped.has(c.id)}
                  onFlip={() => toggleFlip(c.id)} onEdit={guard(() => setEditing(c))} edited={isEdited(c)} />
              ))}
            </div>
            {!shown.length && (
              <p style={{ color: C.muted, padding: "40px 0", textAlign: "center" }}>
                Aucune carte ne correspond. Essayez un autre mot, ou changez de famille.
              </p>
            )}
            <footer className="eyebrow" style={{ marginTop: 56, borderTop: `2px solid ${C.noir}`, paddingTop: 18, color: C.muted, lineHeight: 1.8 }}>
CAUSONS IA · JEU DE CARTES DE CONVERSATION SUR L’IA · IAGORA / AMUSEURS<br />ÉDITION DE TRAVAIL — VÉRIFIER LES CHIFFRES AVANT IMPRESSION
            </footer>
          </main>
        </>
      )}

      {pendingAction && (
        <PasswordPrompt onCancel={() => setPendingAction(null)} onSuccess={unlock} />
      )}

      {editing && unlocked && (
        <Editor card={editing} onClose={() => setEditing(null)}
          onSave={(c) => { saveCard(c); setEditing(c); }}
          onDelete={() => deleteCard(editing.id)}
          onDuplicate={() => duplicateCard(editing)}
          onReset={() => resetCard(editing.id)}
          resettable={original[editing.id] !== undefined} />
      )}
    </div>
  );
}

function ExportMenu({ onExport }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const k = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", h);
    document.addEventListener("keydown", k);
    return () => { document.removeEventListener("mousedown", h); document.removeEventListener("keydown", k); };
  }, [open]);

  const Item = ({ kind, label, hint }) => (
    <button className="menu-item w-full text-left px-3 py-2.5"
      onClick={() => { setOpen(false); onExport(kind); }} style={{ borderRadius: R.sm }}>
      <div style={{ fontSize: 13.5, fontWeight: 600 }}>{label}</div>
      <div style={{ fontSize: 11.5, color: C.muted, marginTop: 1 }}>{hint}</div>
    </button>
  );

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button onClick={() => setOpen(!open)} title="Exporter" aria-expanded={open}
        className="flex items-center gap-1.5 px-3 py-2"
        style={{
          background: open ? C.bleu : C.page, color: open ? "#fff" : C.encre,
          border: `2px solid ${open ? C.bleu : C.ligne}`, borderRadius: R.pill, fontSize: 12.5, fontWeight: 600,

          border: `2px solid ${C.noir}`, borderRadius: R.md, padding: 6, zIndex: 40, boxShadow: SH.lg,

const inp = {
  width: "100%", padding: "10px 12px", border: `2px solid ${C.ligne}`, borderRadius: R.md,

function PasswordPrompt({ onCancel, onSuccess }) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onCancel]);

  const submit = async (e) => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) {
      setErr("Vérification impossible : ouvrez la page en https ou en local.");
      return;
    }
    setBusy(true);
    const ok = (await sha256(pwd)) === EDIT_HASH;
    setBusy(false);
    if (ok) onSuccess();
    else { setErr("Mot de passe incorrect."); setPwd(""); inputRef.current && inputRef.current.focus(); }
  };

  return (
    <div className="noprint" onClick={onCancel}
      style={{ position: "fixed", inset: 0, background: "rgba(20,20,43,.55)", zIndex: 70, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <form onSubmit={submit} onClick={(e) => e.stopPropagation()}
        role="dialog" aria-modal="true" aria-labelledby="pwd-title"
        style={{ background: "#fff", width: "min(420px, 100%)", borderRadius: R.lg, padding: "24px 24px 20px", boxShadow: SH.lg }}>
        <div className="eyebrow" style={{ color: C.rose }}>ÉDITION PROTÉGÉE</div>
        <h2 id="pwd-title" className="display" style={{ fontSize: 30, color: C.bleu, margin: "8px 0 10px" }}>
          Mot de passe
        </h2>
        <p style={{ fontSize: 14.5, lineHeight: 1.55, marginBottom: 14 }}>
          La modification des cartes est réservée à l’équipe. Saisissez le mot de passe pour continuer.
        </p>
        <input ref={inputRef} type="password" value={pwd} autoComplete="current-password"
          aria-label="Mot de passe d’édition" aria-invalid={!!err} aria-describedby={err ? "pwd-err" : undefined}
          onChange={(e) => { setPwd(e.target.value); setErr(""); }}
          style={{ width: "100%", border: `2px solid ${err ? C.roseDeep : C.ligne}`, borderRadius: R.md, padding: "10px 12px", fontSize: 15, fontFamily: F_BODY, outline: "none" }} />
        {err && <p id="pwd-err" role="alert" style={{ color: C.roseDeep, fontSize: 13.5, marginTop: 8 }}>{err}</p>}
        <div className="flex justify-end gap-2" style={{ marginTop: 18 }}>
          <button type="button" onClick={onCancel} className="link-pink" style={{ fontSize: 14, fontWeight: 600, padding: "8px 12px" }}>
            Annuler
          </button>
          <button type="submit" disabled={busy || !pwd}
            style={{ background: C.bleu, color: "#fff", fontSize: 14, fontWeight: 600, padding: "9px 18px", borderRadius: R.pill, opacity: busy || !pwd ? 0.55 : 1 }}>
            {busy ? "Vérification…" : "Déverrouiller"}
          </button>
        </div>
      </form>
    </div>
  );
}

            {g.p && <p style={{ fontSize: 15, lineHeight: 1.65 }}>{g.p}</p>}
            {g.l && (
              <ul style={{ listStyle: "none", padding: 0, display: "grid", gap: 7 }}>
                {g.l.map((x, j) => (
                  <li key={j} className="flex gap-2.5" style={{ fontSize: 15, lineHeight: 1.6 }}>
                    <span style={{ color: C.rose, fontWeight: 700 }}>★</span><span>{x}</span>
                  </li>
                ))}
              </ul>
            )}
          </section>
        ))}
        <section style={{ background: C.bleu, color: "#fff", borderRadius: R.lg, padding: "20px 22px" }}>
          <h3 className="display" style={{ fontSize: 20, marginBottom: 8 }}>Règle du jeu, en trois lignes.</h3>
          <p style={{ fontSize: 15, lineHeight: 1.65 }}>
            Piochez une carte, lisez l’accroche à voix haute. Donnez votre premier avis, ou racontez une expérience.
            L’animateur relance une ou deux fois — puis on repose la carte et on en pioche une autre quand on veut.
            Il n’y a pas de gagnant : le but, c’est la conversation.
          </p>
        </section>
      </div>
    </Panel>
  );
}

function VerifPanel({ onClose }) {
  const Block = ({ title, items, color }) => (
    <section style={{ background: C.bleuSoft, borderRadius: R.lg, padding: "18px 20px" }}>
      <h3 className="display flex items-center gap-2.5" style={{ fontSize: 20, color: C.bleu, marginBottom: 10 }}>
        <span style={{ width: 11, height: 11, borderRadius: R.pill, background: color, display: "inline-block" }} />{title}
      </h3>
      <ul style={{ listStyle: "none", padding: 0, display: "grid", gap: 6 }}>
        {items.map((x, i) => <li key={i} className="flex gap-2" style={{ fontSize: 14.5, lineHeight: 1.6 }}><span style={{ color: C.rose }}>★</span><span>{x}</span></li>)}
      </ul>
    </section>
  );
  return (
    <Panel kicker="AVANT D’ENVOYER À L’IMPRESSION" title="Ce qui est solide, ce qui bouge" onClose={onClose}>
      <div style={{ display: "grid", gap: 16 }}>
        <Block title="Chiffres solides et sourcés" items={VERIF.solides} color={FAM.vert.color} />
        <Block title="Chiffres fragiles ou périssables" items={VERIF.fragiles} color={FAM.rouge.color} />
        <Block title="Cartes sans lien : rien à sourcer" items={VERIF.sansLien} color={FAM.jeu.color} />
        <p style={{ fontSize: 14.5, color: C.muted, lineHeight: 1.65 }}>
          Conseil : datez le paquet (« édition octobre 2026 ») et prévoyez une réédition rapide.
          Une quinzaine de cartes reposent sur une actualité mouvante.
        </p>
      </div>
    </Panel>
  );
}

/* ------------------------------ impression ------------------------------ */

function PrintSheet({ cards, onClose }) {
  return (
    <div className="px-5 py-8" style={{ maxWidth: 1100, margin: "0 auto" }}>
      <div className="noprint flex flex-wrap items-center justify-between gap-3 mb-6">
        <button onClick={onClose} className="flex items-center gap-2 eyebrow link-pink"
          style={{ color: C.muted }}>
          <ArrowLeft size={14} strokeWidth={2} /> Retour aux cartes
        </button>
        <div className="flex items-center gap-3">
          <p style={{ fontSize: 13, color: C.muted, maxWidth: 460 }}>
            Deux cartes par ligne, pliage sur le pointillé : le haut fait le recto, le bas le verso.
            Imprimez en A4, marges 10 mm.
          </p>
          <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2.5"
            style={{ background: C.bleu, color: "#fff", border: `2px solid ${C.bleu}`, borderRadius: R.pill, fontWeight: 600, fontSize: 14 }}>
            <Printer size={16} strokeWidth={2} /> Imprimer
          </button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
        {cards.map((c) => {
          const f = famOf(c.fam);
          return (
            <div key={c.id} className="sheet" style={{ border: `2px solid ${C.noir}`, borderRadius: R.md, overflow: "hidden", background: C.page }}>
              <div style={{ padding: "9px 11px 11px", background: C.bleuSoft }}>
                <div className="flex items-center justify-between eyebrow" style={{ fontSize: 8 }}>
                  <span style={{ color: C.rose }}>NUMÉRO {num(c.id)}</span>
                  <span style={{ color: f.deep }}>{f.label.toUpperCase()}</span>
                </div>
                <p className="display" style={{ fontSize: 16, marginTop: 7, color: C.bleu }}>{c.recto}</p>
              </div>

              <div style={{ borderTop: `2px dashed ${C.noir}`, padding: "9px 11px 11px", fontSize: 9.5, lineHeight: 1.5 }}>
                <div className="eyebrow" style={{ fontSize: 8, color: f.deep }}>{c.titre.toUpperCase()}</div>
                {c.verso && <p style={{ marginTop: 4 }}>{c.verso}</p>}
                {c.items && c.items.length > 0 && (
                  <ol style={{ margin: "4px 0 0", paddingLeft: 14 }}>
                    {c.items.map((it, i) => <li key={i} style={{ marginTop: 2 }}>{it}</li>)}
                  </ol>
                )}
                {c.sources && c.sources.length > 0 && (
                  <div style={{ marginTop: 5 }}>
                    {c.sources.map((s, i) => (
                      <div key={i} style={{ fontSize: 7.8, color: C.muted, wordBreak: "break-all", lineHeight: 1.4 }}>
                        <span style={{ color: C.rose }}>★ </span><strong>{s.label}</strong>{s.url ? " — " + s.url : ""}
                      </div>
                    ))}
                  </div>
                )}
                {c.relance && <p style={{ marginTop: 6, fontStyle: "italic", borderLeft: `2px solid ${C.bleu}`, paddingLeft: 6 }}>« {c.relance} »</p>}
                {c.relance2 && <p style={{ marginTop: 2, fontStyle: "italic", color: C.muted }}>→ « {c.relance2} »</p>}
                {c.piste && (
                  <p style={{ marginTop: 6, borderLeft: `2px solid ${f.color}`, paddingLeft: 6 }}>
                    <strong className="eyebrow" style={{ fontSize: 8, color: f.deep }}>PISTE </strong>{c.piste}
                  </p>
                )}
                {c.duo && <p className="eyebrow" style={{ marginTop: 5, fontSize: 7.8, color: C.muted }}>DUO AVEC LA CARTE N° {num(c.duo)}</p>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CausonsIA />);
</script>
</body>
</html>
